[project]
name = "markdown-merge"
version = "1.0.0"
description = "Token-aware Markdown file merger that keeps Markdown files unchanged"
requires-python = ">=3.11"
dependencies = [
    "tiktoken>=0.9.0",
]

[project.scripts]
mdmerge = "markdown_merge.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/markdown_merge"]
